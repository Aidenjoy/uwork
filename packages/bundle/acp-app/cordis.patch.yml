# The automation-only ACP application over dsh-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup]
      config:
        # The API-key route is disabled in this deployment; the account route reaches the
        # utoken gateway with the signed-in key.
        provider: deepseek-account
        model: !!js "process.env.DSH_DEFAULT_MODEL || 'deepseek-v4-flash'"

- id: hmr
  disabled: true
